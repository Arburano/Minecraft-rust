# Advanced overworld (the `climate` engine, docs/architecture/worldgen.md,
# "Engines"). Our own design: continents and oceans, erosion and ridges for
# mountains and plateaus, temperature cooling with height for snowy peaks,
# biomes chosen by climate ranges, several tree kinds. Surface layers, caves,
# ores and trees use the same stages as the classic engine.
engine = "climate"
sea_level = 62

[climate]
continentalness_scale = 0.0011   # ~900-block continents and oceans
erosion_scale = 0.0016           # where mountains may rise
ridge_scale = 0.0035             # peaks and valleys
temperature_scale = 0.0012
humidity_scale = 0.0014
detail_scale = 0.03
detail = 2.5                     # +- blocks of small bumps
# Base height by continentalness (-1 deep ocean .. 1 far inland): [x, y].
continentalness = [[-1.0, 18], [-0.45, 30], [-0.2, 48], [-0.08, 59], [0.0, 64], [0.25, 70], [0.6, 80], [1.0, 96]]
# Mountain factor by erosion: low erosion = high mountains.
erosion = [[-1.0, 1.0], [-0.4, 0.8], [0.0, 0.35], [0.4, 0.12], [1.0, 0.05]]
# Peak height (blocks) by ridge value 0 (valley) .. 1 (ridge), times the factor.
ridges = [[0.0, 0], [0.4, 4], [0.7, 30], [0.9, 85], [1.0, 115]]
inland = [-0.05, 0.25]           # mountains fade in from the coast
height_cooling = 0.0035          # temperature drop per block above the sea (snowy peaks)

[terrain]                        # only the blocks are used by this engine
base_height = 64
amplitude = 0
roughness = 0
scale = 0.01
stone = "core:stone"
fluid = "core:water"

[caves]
air = "core:air"
threshold = 0.42        # carve where |3D noise| > threshold
scale = 0.045
min_y = -60
max_below_surface = 6   # do not carve within this many blocks under the surface

# Biomes: the first one whose ranges all hold is chosen (file order); the
# last has no ranges and catches everything else.
[[biomes]]
id = "snowy_peaks"
climate = { height = [150, 400], temperature = [0.0, 0.45] }
top = "overworld_plus:snow_block"
filler = "core:stone"
filler_depth = 0
trees_per_column = 0.0

[[biomes]]
id = "rocky_mountains"
climate = { height = [118, 400] }
top = "core:stone"
filler = "core:stone"
filler_depth = 0
trees_per_column = 0.15
trees = ["spruce"]

[[biomes]]
id = "ocean"
climate = { continentalness = [-1.0, -0.12] }
top = "core:gravel"
filler = "core:sand"
filler_depth = 3
trees_per_column = 0.0

[[biomes]]
id = "snowy_taiga"
climate = { temperature = [0.0, 0.15] }
top = "overworld_plus:snow_block"
filler = "core:dirt"
filler_depth = 3
trees_per_column = 0.8
trees = ["spruce"]

[[biomes]]
id = "taiga"
climate = { temperature = [0.15, 0.28] }
top = "core:grass_block"
filler = "core:dirt"
filler_depth = 3
trees_per_column = 3.0
trees = ["spruce"]

[[biomes]]
id = "desert"
climate = { temperature = [0.62, 1.0], humidity = [0.0, 0.45] }
top = "core:sand"
filler = "core:sand"
filler_depth = 5
trees_per_column = 0.0

[[biomes]]
id = "birch_forest"
climate = { temperature = [0.4, 0.6], humidity = [0.6, 1.0] }
top = "core:grass_block"
filler = "core:dirt"
filler_depth = 3
trees_per_column = 3.5
trees = ["birch"]

[[biomes]]
id = "forest"
climate = { humidity = [0.5, 1.0] }
top = "core:grass_block"
filler = "core:dirt"
filler_depth = 4
trees_per_column = 3.0
trees = ["default", "birch"]

[[biomes]]
id = "plains"
top = "core:grass_block"
filler = "core:dirt"
filler_depth = 3
trees_per_column = 0.15

[beach]
block = "core:sand"
max_above_sea = 2

[[ores]]
block = "core:coal_ore"
replaces = "core:stone"
veins_per_column = 12
vein_size = 9
min_y = 0
max_y = 128

[[ores]]
block = "core:iron_ore"
replaces = "core:stone"
veins_per_column = 6
vein_size = 6
min_y = -64
max_y = 64

[[ores]]
block = "core:gravel"
replaces = "core:stone"
veins_per_column = 3
vein_size = 16
min_y = -64
max_y = 96

# The default tree kind ("default"): oak.
[trees]
log = "core:oak_log"
leaves = "core:oak_leaves"
min_trunk = 4
max_trunk = 6

[[tree_kinds]]
id = "birch"
log = "overworld_plus:birch_log"
leaves = "overworld_plus:birch_leaves"
min_trunk = 5
max_trunk = 7

[[tree_kinds]]
id = "spruce"
log = "overworld_plus:spruce_log"
leaves = "overworld_plus:spruce_leaves"
min_trunk = 6
max_trunk = 9
shape = "cone"
