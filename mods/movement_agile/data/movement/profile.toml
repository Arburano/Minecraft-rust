# Agile movement profile (example module, docs/modding/movement-profiles.md):
# the classic base numbers plus abilities. Owner review of the feel pending.
# Tuned to the classic feel: walk ≈ 4.3 blocks/s, sprint ≈ 5.6 blocks/s,
# jump ≈ 1.25 blocks. The engine has no built-in numbers; mods may override.
width = 0.6
height = 1.8
eye_height = 1.62
step_height = 0.6
gravity = 0.08
vertical_drag = 0.98
jump_velocity = 0.42
sprint_jump_boost = 0.2
ground_friction = 0.546
air_friction = 0.91
walk_accel = 0.1
air_accel = 0.02
sprint_multiplier = 1.3
fluid_drag = 0.8
fluid_accel = 0.02
fluid_gravity = 0.02
swim_up = 0.04
reach = 4.5
swim_blocks = ["core:water"]
# Flight (double-tap jump; jump = up, descend = down; landing ends it).
# Fly ≈ 11 blocks/s, sprint flying ≈ 22 blocks/s, vertical ≈ 7.5 blocks/s at speed ×1.
can_fly = false   # the double jump uses the second press
fly_accel = 0.05
fly_vertical_accel = 0.15
fly_vertical_drag = 0.6
fly_sprint_multiplier = 2.0
fly_speed_range = [0.25, 8.0]   # mouse wheel range of the fly speed multiplier

# Sprint pressed while moving: a short burst forward, once a second.
[[abilities]]
id = "dash"
trigger = "sprint_pressed"
conditions = ["moving", "not_flying"]
cooldown = 20
animation = "dash"
effects = [{ kind = "impulse", forward = 0.9, up = 0.05 }]

# Jump pressed in the air: a second jump, once until landing.
[[abilities]]
id = "double_jump"
trigger = "jump_pressed"
conditions = ["in_air"]
charges = 1
animation = "double_jump"
effects = [{ kind = "set_velocity", vertical = 0.42 }]

# Jump held against a wall while falling: slide down slowly.
[[abilities]]
id = "wall_slide"
trigger = "jump_held"
conditions = ["in_air", "touching_wall", "falling"]
animation = "wall_slide"
effects = [{ kind = "hold_surface", slide = 0.06 }]

# Sneak on the ground: crawl through 1-block gaps.
[[abilities]]
id = "crawl"
trigger = "descend_held"
conditions = ["on_ground"]
animation = "crawl"
effects = [{ kind = "box_size", height = 0.6, eye_height = 0.45 }]

# Sneak while falling: glide.
[[abilities]]
id = "glide"
trigger = "descend_held"
conditions = ["in_air", "falling"]
animation = "glide"
effects = [{ kind = "gravity_scale", scale = 0.15 }]
