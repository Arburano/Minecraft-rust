# An example movement provider (ADR-0013, T1-18): the classic numbers plus
# abilities built from engine primitives — dash, double jump, wall slide,
# crawl and glide. A build lists it instead of `movement` (one provider per
# slot). No flight: a double-tapped jump is the double jump here.
[mod]
id = "movement_agile"
version = "0.1.0"
api = "^0.1"
side = "both"
authors = ["project team"]
description = "Agile movement: dash, double jump, wall slide, crawl, glide"
provides = ["movement"]

[dependencies]
core = "^0.1"

[permissions]

[budget]
tick_ms = 0.2
