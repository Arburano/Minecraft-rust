name: CI

on:
  push:
    branches: [main]
    # Documentation-only changes need no build.
    paths-ignore:
      - "docs/**"
      - "tasks/**"
      - "task-reports/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "tasks/**"
      - "task-reports/**"
      - "**.md"
  workflow_dispatch:

# A new push to the same PR or branch cancels the run still in progress, so
# only the latest commit uses Actions minutes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info is the biggest part of target/ and is not needed in CI.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The workspace (wasmtime, wgpu, tracy) plus release benches outgrew the
        # runner's free disk; drop preinstalled SDKs this project never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          # Only main writes the cache; PRs restore it (main's cache is
          # visible to every branch, a PR's cache only to that PR).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: cargo test --workspace
      - name: Worldgen without the built-in overworld (T1-18)
        run: cargo check -p worldgen --no-default-features
      - name: Benches compile
        run: cargo bench --workspace --no-run
