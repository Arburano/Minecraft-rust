[package]
name = "engine-core"
description = "Tick loop, tick phases, job scheduler, time budgets, common IDs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
crossbeam-channel = { workspace = true }
rayon = { workspace = true }
thread-priority = { workspace = true }
thiserror = { workspace = true }
tracy-client = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "jobs"
harness = false

[features]
# Tracy profiler zones (docs/architecture/engine-core.md, "Profiling"). Off by default:
# without it `zone!` compiles to nothing.
profiling = ["dep:tracy-client"]

[lints]
workspace = true
