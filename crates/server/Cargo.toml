[package]
name = "server"
description = "Dedicated server binary: region-threaded simulation, networking, persistence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
auth = { path = "../auth" }
clap = { workspace = true }
engine-core = { path = "../engine-core" }
world = { path = "../world" }
worldgen = { path = "../worldgen" }
protocol = { path = "../protocol" }
net = { path = "../net" }
sim = { path = "../sim" }
crossbeam-channel = { workspace = true }
bevy_ecs = { workspace = true }
rayon = { workspace = true }
glam = { workspace = true }
quinn = { workspace = true }
tokio = { workspace = true }
# Self-signed certificate for offline mode (LAN / loopback only, legal.md rule 7);
# real certificates come with online play (stage 3).
rcgen = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
memory-stats = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }

[features]
# Tracy profiler zones: `cargo run -p server --features profiling`.
profiling = ["engine-core/profiling"]

[lints]
workspace = true
