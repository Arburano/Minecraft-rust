[package]
name = "worldgen"
description = "World generation pipeline (terrain -> biomes -> caves -> structures -> decorations), heightmap pre-pass, LOD source data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["builtin-overworld"]
# The built-in overworld stages (surface, terrain, caves, ores, trees; ADR-0013).
# A build with its own generator (stage 3: WASM stages) leaves them out.
builtin-overworld = []

[dependencies]
engine-core = { path = "../engine-core" }
serde = { workspace = true }
toml = { workspace = true }
noise = { workspace = true }
world = { path = "../world" }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
