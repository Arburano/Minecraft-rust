[package]
name = "client"
description = "Game client binary: window, in-game launcher menu, renderer, embedded server for singleplayer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { workspace = true }
engine-core = { path = "../engine-core" }
world = { path = "../world" }
render = { path = "../render" }
net = { path = "../net" }
sim = { path = "../sim" }
assets = { path = "../assets" }
auth = { path = "../auth" }

[features]
# Tracy profiler zones: `cargo run -p client --features profiling`.
profiling = ["engine-core/profiling"]

[lints]
workspace = true
