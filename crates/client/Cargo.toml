[package]
name = "client"
description = "Game client binary: window, in-game launcher menu, renderer, embedded server for singleplayer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { workspace = true }
engine-core = { path = "../engine-core" }
world = { path = "../world" }
worldgen = { path = "../worldgen" }
light = { path = "../light" }
mesh = { path = "../mesh" }
render = { path = "../render" }
net = { path = "../net" }
protocol = { path = "../protocol" }
# Logic both ends share (intents, state hash, corrections, entity deltas).
netcode = { path = "../netcode" }
# The embedded server for single-player (feature `singleplayer`, T2-11).
server = { path = "../server", default-features = false, optional = true }
quinn = { workspace = true }
tokio = { workspace = true }
sim = { path = "../sim" }
assets = { path = "../assets" }
auth = { path = "../auth" }
glam = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
egui = { workspace = true, features = ["default_fonts"] }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
pollster = { workspace = true }
zip = { workspace = true }
serde_json = { workspace = true }
memory-stats = { workspace = true }

[dev-dependencies]
png = { workspace = true }
# Integration tests run a real server next to the client.
server = { path = "../server", default-features = false }

[features]
# Every capability and single-player for development builds (ADR-0018).
default = ["moving_grids", "singleplayer"]
# Moving block structures (ADR-0019); also in the embedded server.
moving_grids = ["server?/moving_grids"]
# Single-player worlds on an embedded server (T2-08). Without it the client
# has no server code and only joins servers (T2-11).
singleplayer = ["dep:server"]
# Tracy profiler zones: `cargo run -p client --features profiling`.
profiling = ["engine-core/profiling"]

[lints]
workspace = true

[[bin]]
name = "bots"
path = "src/bin/bots.rs"
# `--embedded` runs a server in the process.
required-features = ["singleplayer"]
